# Hexo 博客配置；构建/校验命令见 package.json 和 docs/。
title: 飞奔的蜗牛
description: 编程界的懒人，偶尔写写。
keywords:
  - 编码人生
author: Crazy Boy
language: zh-CN
timezone: Asia/Shanghai
url: 'https://crazy-boy.com'
root: /
permalink: 'posts/:abbrlink.html'
permalink_defaults: null
pretty_urls:
  trailing_index: true
  trailing_html: true
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render:
  - tools/**/*.exe
  - tools/**/README.md
  - downloads/**
  - posts/*.html
  - README.md
  - vue-practice/**
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: null
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: true
  tab_replace: null
  wrap: true
  hljs: false
index_generator:
  path: ''
  per_page: 12
  order_by: '-date'
default_category: uncategorized
category_map: null
tag_map: null
meta_generator: true
date_format: YYYY-MM-DD
time_format: 'HH:mm:ss'
updated_option: mtime
per_page: 15
pagination_dir: page
include: null
exclude: null
ignore: null
theme: itsneko
deploy:
  type: git
  repo:
    github: 'https://github.com/crazy-boy/crazy-boy.github.io.git'
  branch: master
postInfo:
  date: true
  update: false
  wordCount: true
  totalCount: false
  min2read: true
  readCount: true
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub: null
  content: null
  content_limit: 140
  content_limit_delim: ' '
  order_by: '-date'
abbrlink:
  alg: crc16
  rep: hex
syntax_highlighter: highlight.js
